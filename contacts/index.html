<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qrnocrap/contacts</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>

<body>
    <h1>qrnocrap/contacts</h1>
    <div>
        <input type="text" id="firstNameInput" aria-label="First Name" data-i18n="firstNameInput.placeholder"
            placeholder="first name">
        <input type="text" id="lastNameInput" aria-label="Last Name" data-i18n="lastNameInput.placeholder"
            placeholder="last name">
    </div>
    <input type="text" id="organizationInput" aria-label="Organization Name" data-i18n="organizationInput.placeholder"
        placeholder="organization name">
    <div>
        <input type="checkbox" id="isCompanyInput" aria-label="Is Company" data-i18n="isCompanyInput.label">
        <label for="isCompanyInput" data-i18n="isCompanyInput.label">is company</label>
    </div>
    <input type="text" id="emailInput" aria-label="Email Address" data-i18n="emailInput.placeholder"
        placeholder="email address">
    <input type="text" id="phoneInput" aria-label="Phone Number" data-i18n="phoneInput.placeholder"
        placeholder="phone number">
    <input type="text" id="streetInput" aria-label="Street Address" data-i18n="streetInput.placeholder"
        placeholder="street address">
    <div>
        <input type="text" id="cityInput" aria-label="City" data-i18n="cityInput.placeholder" placeholder="city">
        <input type="text" id="stateInput" aria-label="State/Province" data-i18n="stateInput.placeholder"
            placeholder="state/province">
    </div>
    <div>
        <input type="text" id="zipInput" aria-label="ZIP/Postal Code" data-i18n="zipInput.placeholder"
            placeholder="zip/postal code">
        <input type="text" id="countryInput" aria-label="Country" data-i18n="countryInput.placeholder"
            placeholder="country">
    </div>
    <input type="text" id="contactUrlInput" aria-label="Contact URL" data-i18n="contactUrlInput.placeholder" <input
        placeholder="contact url">
    <input type="date" id="birthdayInput" aria-label="Birthday" data-i18n="birthdayInput.placeholder"
        placeholder="birthday">
    <div id="qrcode"></div>
    <div>
        <button id="download-button" aria-label="Download QR code" data-i18n="download-button.label">download</button>
        <button id="copy-button" aria-label="Copy QR code" data-i18n="copy-button.label">copy</button>
    </div>
    <a href="../" data-i18n="main.link">qrnocrap for everything else</a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../main.js"></script>
    <script src="../js/i18n.js"></script>
</body>

</html>
